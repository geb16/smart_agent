# .pre-commit-config.yaml
# This configuration file sets up pre-commit hooks for a Python project.
# autoflake → isort → black → flake8 → mypy

repos:
  # 1️⃣ Automatically remove unused imports and variables
  - repo: https://github.com/myint/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        args:
          - '--remove-all-unused-imports'
          - '--remove-unused-variables'
          - '--ignore-init-module-imports'
          - '--in-place'
          - '--recursive'
          - .

  #2️⃣ Sort imports before formatting
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args:
          - '--profile'
          - black

  # 3️⃣ Format code consistently with Black
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        args:
          - '--line-length'
          - '150'

  # 4️⃣ Lint for style issues and errors
  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions
          - flake8-builtins
        args:
          - '--max-line-length=150'
          - '--extend-ignore=E203, W503'
  # 5️⃣ mypy for type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args:
          - '--ignore-missing-imports'
          